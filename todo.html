<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 2rem 1rem; }
    .app { max-width: 420px; margin: 0 auto; background: #fff; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { margin-top: 0; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input[type="text"] { flex: 1; padding: .5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: .5rem .8rem; border: none; border-radius: 6px; background: #3b82f6; color: #fff; cursor: pointer; font-size: .9rem; }
    button:hover { background: #2563eb; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: .6rem; padding: .5rem 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: #999; }
    li button { background: #ef4444; }
    li button:hover { background: #dc2626; }
    .empty { color: #888; text-align: center; padding: 1rem 0; }
  </style>
</head>
<body>
  <div class="app">
    <h1>To-Do List</h1>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="Add a task..." autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <ul id="task-list"></ul>
  </div>

  <script>
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const list = document.getElementById('task-list');
    const STORAGE_KEY = 'todo-tasks';

    let tasks = load();

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(data) ? data : [];
      } catch (e) {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (e) { /* storage unavailable; ignore */ }
    }

    function render() {
      list.innerHTML = '';
      if (tasks.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = 'No tasks yet.';
        list.appendChild(empty);
        return;
      }
      tasks.forEach(task => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          save();
          render();
        });

        const span = document.createElement('span');
        span.textContent = task.text;

        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          save();
          render();
        });

        li.append(checkbox, span, del);
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now() + Math.random(), text, done: false });
      input.value = '';
      save();
      render();
    });

    render();
  </script>
</body>
</html>
